<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Shop Store</title>
</head>
<body>
    <div class="page">
        <!-- HEADER -->
        <header class="header">
            <h2 class="title-store">SHOP STORE</h2>
            <span class="header-badge"><i class="fas fa-store"></i> 2026</span>
        </header>
        
        <!-- PRODUCTS -->
        <section class="products">
            <h2><i class="fas fa-boxes"></i> Products</h2>
            <div class="product-container" id="products"></div>
        </section>
        
        <!-- CART -->
        <section class="cart">
            <h2><i class="fas fa-shopping-cart"></i> My Cart</h2>
            <div class="cart-container" id="cart-products"></div>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
